name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PHP_VERSION: "8.2"

jobs:
  lint:
    name: PHP Lint & Syntax Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none
      - name: Lint all PHP files
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r -d '' f; do
            if ! php -l "$f" >/dev/null; then
              echo "FAIL: $f"
              fail=$((fail + 1))
            fi
          done < <(find app bootstrap config database routes tests -type f -name '*.php' -print0)
          echo "Checked PHP sources."
          if [ "$fail" -gt 0 ]; then
            echo "$fail file(s) failed syntax check."
            exit 1
          fi
          echo "Syntax OK."

  # Reports style issues but does NOT block Build (codebase is not Pint-clean yet).
  # After running `./vendor/bin/pint` once locally and committing, you can enforce --test again.
  code-style:
    name: Code Style (PHP_CodeSniffer)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          tools: composer:v2
          coverage: none
          extensions: mbstring, pdo_sqlite, sqlite3, bcmath, ctype, fileinfo, openssl, tokenizer, xml, curl
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Laravel Pint (advisory)
        run: |
          if ./vendor/bin/pint --test; then
            echo "Code style OK."
          else
            echo "::warning::Pint found style differences. Run: ./vendor/bin/pint"
          fi

  static-analysis:
    name: Static Analysis (PHPStan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          tools: phpstan
          coverage: none
          extensions: mbstring, pdo_sqlite, sqlite3, bcmath, ctype, fileinfo, openssl, tokenizer, xml, curl
      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ runner.os }}-${{ env.PHP_VERSION }}-${{ hashFiles('composer.lock') }}
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: PHPStan
        run: phpstan analyse --configuration=phpstan.neon --no-progress --memory-limit=1G

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          tools: composer:v2
          coverage: none
      - name: Composer audit (lock file)
        run: composer audit --locked --no-interaction

  validate-config:
    name: Validate Config & JSON
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          tools: composer:v2
          coverage: none
          extensions: mbstring, pdo_sqlite, sqlite3, bcmath, ctype, fileinfo, openssl, tokenizer, xml, curl
      - name: Validate composer.json
        run: composer validate --strict --no-check-publish
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Prepare .env
        run: |
          cp .env.example .env
          php artisan key:generate --force
      - name: Config cache (syntax of config/*.php)
        run: |
          php artisan config:clear
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache
        env:
          APP_ENV: production
          APP_DEBUG: "false"
          DB_CONNECTION: sqlite
          DB_DATABASE: ":memory:"
          SESSION_DRIVER: array
          CACHE_STORE: array
          QUEUE_CONNECTION: sync
          SMS_DRIVER: log

  schema:
    name: Database Schema Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          tools: composer:v2
          coverage: none
          extensions: mbstring, pdo_sqlite, sqlite3, bcmath, ctype, fileinfo, openssl, tokenizer, xml, curl
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate --force
          touch database/database.sqlite
      - name: Migrate (SQLite)
        run: php artisan migrate --force --no-interaction
        env:
          APP_ENV: testing
          DB_CONNECTION: sqlite
          DB_DATABASE: ${{ github.workspace }}/database/database.sqlite
          SESSION_DRIVER: array
          CACHE_STORE: array
          QUEUE_CONNECTION: sync
          SMS_DRIVER: log
      - name: Migrate fresh + seed
        run: php artisan migrate:fresh --seed --force --no-interaction
        env:
          APP_ENV: testing
          DB_CONNECTION: sqlite
          DB_DATABASE: ${{ github.workspace }}/database/database.sqlite
          SESSION_DRIVER: array
          CACHE_STORE: array
          QUEUE_CONNECTION: sync
          SMS_DRIVER: log

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          tools: composer:v2
          coverage: none
          extensions: mbstring, pdo_sqlite, sqlite3, bcmath, ctype, fileinfo, openssl, tokenizer, xml, curl
      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ runner.os }}-${{ env.PHP_VERSION }}-${{ hashFiles('composer.lock') }}
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate --force
          echo "SMS_DRIVER=log" >> .env
          echo "QUEUE_CONNECTION=sync" >> .env
      - name: Run PHPUnit
        run: php artisan test
        env:
          APP_ENV: testing
          DB_CONNECTION: sqlite
          DB_DATABASE: ":memory:"
          QUEUE_CONNECTION: sync
          SESSION_DRIVER: array
          CACHE_STORE: array
          SMS_DRIVER: log

  build:
    name: Build & Artifact
    runs-on: ubuntu-latest
    needs:
      - lint
      - code-style
      - static-analysis
      - security
      - validate-config
      - schema
      - tests
    if: |
      always() &&
      needs.lint.result == 'success' &&
      needs.static-analysis.result == 'success' &&
      needs.security.result == 'success' &&
      needs.validate-config.result == 'success' &&
      needs.schema.result == 'success' &&
      needs.tests.result == 'success' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    steps:
      - uses: actions/checkout@v4
      - name: Build production ZIP
        run: |
          set -euo pipefail
          SHORT=$(git rev-parse --short HEAD)
          OUT="borjik-${SHORT}.zip"
          zip -r "$OUT" . \
            -x ".git/*" \
            -x ".github/*" \
            -x "tests/*" \
            -x "vendor/*" \
            -x "node_modules/*" \
            -x ".env" \
            -x ".env.backup" \
            -x ".env.production" \
            -x "storage/logs/*" \
            -x "storage/framework/cache/*" \
            -x "storage/framework/sessions/*" \
            -x "storage/framework/views/*" \
            -x "storage/pail/*" \
            -x "public/hot" \
            -x "public/build/*" \
            -x "*.log" \
            -x ".phpunit.result.cache" \
            -x ".phpunit.cache/*" \
            -x "phpstan.neon" \
            -x "phpcs.xml" \
            -x ".DS_Store" \
            -x "*/.DS_Store" \
            -x "*__MACOSX*"
          ls -lh "$OUT"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: borjik-release
          path: borjik-*.zip
          if-no-files-found: error
          retention-days: 30

  diagnostics:
    name: CI Failure Diagnostics
    runs-on: ubuntu-latest
    needs:
      - lint
      - code-style
      - static-analysis
      - security
      - validate-config
      - schema
      - tests
    if: |
      always() &&
      (needs.lint.result == 'failure' ||
       needs.static-analysis.result == 'failure' ||
       needs.security.result == 'failure' ||
       needs.validate-config.result == 'failure' ||
       needs.schema.result == 'failure' ||
       needs.tests.result == 'failure')
    steps:
      - name: Summarize failures
        run: |
          echo "## CI Failure Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Job | Result |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----|--------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| PHP Lint & Syntax Check | ${{ needs.lint.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Code Style (advisory) | ${{ needs.code-style.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Static Analysis (PHPStan) | ${{ needs.static-analysis.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Security Audit | ${{ needs.security.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Validate Config & JSON | ${{ needs.validate-config.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Database Schema Validation | ${{ needs.schema.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Tests | ${{ needs.tests.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Open the failed job log above for details." >> "$GITHUB_STEP_SUMMARY"
          exit 1
