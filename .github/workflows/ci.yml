name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        php: ["8.2"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo_sqlite, sqlite3, bcmath, ctype, fileinfo, openssl, tokenizer, xml, curl
          coverage: none
          tools: composer:v2

      - name: Get Composer cache dir
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ matrix.php }}-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-${{ matrix.php }}-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate --force
          # CI-friendly overrides (tests already use sqlite :memory: via phpunit.xml)
          echo "SMS_DRIVER=log" >> .env
          echo "QUEUE_CONNECTION=sync" >> .env
          echo "SESSION_DRIVER=array" >> .env
          echo "CACHE_STORE=array" >> .env

      - name: PHP syntax check
        run: |
          set -e
          fail=0
          while IFS= read -r -d '' f; do
            if ! php -l "$f" > /dev/null; then
              echo "FAIL: $f"
              fail=$((fail + 1))
            fi
          done < <(find app bootstrap config database routes tests -type f -name "*.php" -print0 2>/dev/null)
          if [ "$fail" -gt 0 ]; then
            echo "$fail file(s) have syntax errors."
            exit 1
          fi
          echo "Syntax OK."

      - name: Run tests
        run: php artisan test --parallel --processes=2
        env:
          APP_ENV: testing
          DB_CONNECTION: sqlite
          DB_DATABASE: ":memory:"
          QUEUE_CONNECTION: sync
          SESSION_DRIVER: array
          CACHE_STORE: array
          SMS_DRIVER: log

  package:
    name: Production ZIP
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build release archive
        run: |
          set -e
          SHORT=$(git rev-parse --short HEAD)
          OUT="borjik-${SHORT}.zip"

          # Production-ready source (no vendor — run composer on server)
          # Exclude: tests, docs, CI, git, local env, caches, node_modules
          zip -r "$OUT" . \
            -x ".git/*" \
            -x ".github/*" \
            -x "tests/*" \
            -x "vendor/*" \
            -x "node_modules/*" \
            -x ".env" \
            -x ".env.*" \
            -x "storage/logs/*" \
            -x "storage/framework/cache/*" \
            -x "storage/framework/sessions/*" \
            -x "storage/framework/views/*" \
            -x "storage/pail/*" \
            -x "public/hot" \
            -x "public/build/*" \
            -x "*.log" \
            -x ".phpunit.result.cache" \
            -x ".phpunit.cache/*" \
            -x "README.md" \
            -x "*.md" \
            -x ".DS_Store" \
            -x "*/.DS_Store" \
            -x "*__MACOSX*"

          # Keep .env.example inside the zip (needed for deploy)
          # zip already includes it unless matched by .env.* — re-add explicitly
          zip "$OUT" .env.example 2>/dev/null || true

          ls -lh "$OUT"
          echo "ARTIFACT=$OUT" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: borjik-release
          path: borjik-*.zip
          if-no-files-found: error
          retention-days: 30
