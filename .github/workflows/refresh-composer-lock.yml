name: Refresh vulnerable Symfony dependencies

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-composer-lock.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
      - name: Update patched Symfony components
        run: composer update symfony/http-foundation symfony/http-kernel symfony/routing symfony/yaml --with-all-dependencies --no-interaction --prefer-dist --no-progress
      - name: Verify security audit
        run: composer audit --locked --no-interaction
      - name: Commit lockfile and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add composer.lock
          git rm .github/workflows/refresh-composer-lock.yml
          git commit -m "Update vulnerable Symfony dependencies"
          git push origin main
