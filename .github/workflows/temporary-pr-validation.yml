name: Temporary PR validation

on:
  push:
    branches:
      - feature/property-listing-lead-management

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/property-listing-lead-management
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          tools: composer:v2
          coverage: none
          extensions: mbstring, pdo_sqlite, sqlite3, bcmath, ctype, fileinfo, openssl, tokenizer, xml, curl
      - name: Validate Composer metadata
        run: composer validate --strict --no-check-publish
      - name: Install locked dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Security audit
        run: composer audit --locked --no-interaction
      - name: Prepare test environment
        run: |
          cp .env.example .env
          php artisan key:generate --force
          echo "SMS_DRIVER=log" >> .env
          echo "QUEUE_CONNECTION=sync" >> .env
      - name: Run test suite
        run: php artisan test
        env:
          APP_ENV: testing
          DB_CONNECTION: sqlite
          DB_DATABASE: ":memory:"
          QUEUE_CONNECTION: sync
          SESSION_DRIVER: array
          CACHE_STORE: array
          SMS_DRIVER: log
