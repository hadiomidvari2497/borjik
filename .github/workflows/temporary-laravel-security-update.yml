name: Temporary Laravel security update

on:
  push:
    branches:
      - feature/property-listing-lead-management

permissions:
  contents: write

jobs:
  update-framework:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/property-listing-lead-management
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          tools: composer:v2
          coverage: none
      - name: Update Laravel within the supported 12.x constraint
        run: composer update laravel/framework --with-all-dependencies --no-interaction --prefer-dist --no-progress
      - name: Commit updated lock file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add composer.lock
          if git diff --cached --quiet; then
            echo "No lock-file changes."
            exit 1
          fi
          git commit -m "Fix Laravel security advisory"
          git push origin HEAD:feature/property-listing-lead-management
