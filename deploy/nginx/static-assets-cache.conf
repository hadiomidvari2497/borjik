# Include this file inside the HTTPS server block for sabkhoneh.ir.
# Vite build assets contain content hashes in their filenames, so they can be cached
# for a year without serving stale files after a deployment.
location ^~ /build/assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    access_log off;
}

# Public assets outside Vite's fingerprinted build directory keep stable names.
# Use a 30-day cache; do not mark these files immutable because deployments may
# replace them without changing their URLs (for example, fonts and the homepage logo).
location ~* \.(?:css|js|woff2?|ttf|otf|png|jpe?g|gif|svg|webp|avif|ico)$ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=2592000" always;
    access_log off;
}
