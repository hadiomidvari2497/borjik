# Include this file inside the HTTPS server block for sabkhoneh.ir.
# Static files use stable (non-fingerprinted) names, so use a 7-day TTL rather than immutable/one-year caching.
# HTML and Laravel responses are intentionally not cached by this rule.
location ~* \.(?:css|js|woff2?|ttf|otf|png|jpe?g|gif|svg|webp|avif|ico)$ {
    try_files $uri =404;
    expires 7d;
    access_log off;
}
